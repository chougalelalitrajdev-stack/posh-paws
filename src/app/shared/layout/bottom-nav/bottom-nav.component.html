<nav class="pp-bottom-nav" aria-label="Main">
  @for (item of items(); track item.path) {
    <a
      class="pp-bottom-nav-item"
      [routerLink]="item.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: item.exact }"
    >
      <span class="pp-bottom-nav-icon" aria-hidden="true">{{ item.icon }}</span>
      <span class="pp-bottom-nav-label">{{ item.label }}</span>
    </a>
  }
</nav>
