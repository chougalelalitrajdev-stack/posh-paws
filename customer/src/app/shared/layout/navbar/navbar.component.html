<nav class="pp-navbar" [class.scrolled]="scrolled()">
  <div class="container">
    <div class="nav-inner">

      <!-- ── Brand ──────────────────────────────────── -->
      <a class="navbar-brand-wrap" routerLink="/">
        <!-- <img src="icon/cropped-Posh-Paws_blue-1-300x265.png" alt="Posh Paws" class="brand-logo" /> -->
        <img src="icon/posh-paws-logo 2.png" alt="Posh Paws" class="brand-logo" />


        <!-- <span class="brand-name">Posh Paws</span>
        <span class="brand-tagline">Pet Grooming · Pune</span> -->
      </a>

      <!-- ── Desktop nav links (lg+) ────────────────── -->
      <div class="desktop-links">
        <a class="pp-nav-link" routerLink="/" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }">Home</a>
        <a class="pp-nav-link" routerLink="/services" routerLinkActive="active">Services</a>
        <a class="pp-nav-link" routerLink="/about" routerLinkActive="active">About</a>
        <a class="pp-nav-link" routerLink="/membership" routerLinkActive="active">Membership</a>
        <a class="pp-nav-link" routerLink="/gallery" routerLinkActive="active">Gallery</a>
      </div>

      <!-- ── Right side actions ─────────────────────── -->
      <div class="nav-actions">
        <!-- Theme switcher is temporarily disabled; re-enable when themes load from the backend.
        <pp-theme-switcher class="theme-sw" />
        -->

        <!-- Sign in (hidden on mobile) -->
        <a class="btn-pp-ghost sign-in-btn" routerLink="/account">{{ auth.isLoggedIn() ? 'My account' : 'Log in' }}</a>

        <!-- Account / login icon (mobile only) -->
        <a class="account-icon-btn" routerLink="/account" routerLinkActive="active"
          [attr.aria-label]="auth.isLoggedIn() ? 'My account' : 'Log in or sign up'">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" />
          </svg>
        </a>

        <!-- CTA button -->
        <button class="btn-pp-accent" type="button" (click)="startBooking()">
          <span class="d-none d-sm-inline">Reserve a slot</span>
          <span class="d-sm-none">Book now</span>
        </button>

        <!-- Hamburger (visible below lg) -->
        <button class="hamburger" [class.open]="menuOpen()" (click)="toggleMenu()" aria-label="Toggle navigation"
          [attr.aria-expanded]="menuOpen()">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>

    </div><!-- /nav-inner -->
  </div><!-- /container -->

  <!-- ── Mobile drawer (below lg) ──────────────────── -->
  <div class="mobile-menu" [class.open]="menuOpen()">
    <div class="container">
      <div class="mobile-links">
        <a class="mobile-nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMenu()">Home</a>
        <a class="mobile-nav-link" routerLink="/services" routerLinkActive="active" (click)="closeMenu()">Services</a>
        <a class="mobile-nav-link" routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About</a>
        <a class="mobile-nav-link" routerLink="/membership" routerLinkActive="active"
          (click)="closeMenu()">Membership</a>
        <a class="mobile-nav-link" routerLink="/gallery" routerLinkActive="active" (click)="closeMenu()">Gallery</a>

        <div class="mobile-footer">
          <!-- Theme switcher is temporarily disabled; re-enable when themes load from the backend.
          <pp-theme-switcher />
          -->
          <a class="btn-pp-ghost" routerLink="/account" (click)="closeMenu()">{{ auth.isLoggedIn() ? 'My account' : 'Log in' }}</a>
        </div>
      </div>
    </div>
  </div>

</nav>
