<figure class="quote">
  <div class="quote-stars" aria-label="5 out of 5 stars">★★★★★</div>
  <blockquote class="quote-text">“{{ testimonial().quote }}”</blockquote>

  <figcaption class="quote-author">
    <span class="quote-avatar" aria-hidden="true">{{ testimonial().initial }}</span>
    <span>
      <span class="quote-name">{{ testimonial().author }}</span>
      <span class="quote-meta">{{ testimonial().petLine }}</span>
    </span>
  </figcaption>
</figure>
